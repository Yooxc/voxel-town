<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EXCIT · Spatial Study 03 · Blockout</title>
  <style>
    *{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:14px/1.4 system-ui,sans-serif;color:#253b40;background:#d9e7eb;letter-spacing:0}
    header{padding:12px 18px;background:#f6f8f8;border-bottom:1px solid #becbd0;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    h1{font-size:17px;margin:0}nav{display:flex;gap:2px;flex-wrap:wrap}button,select{font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid #b9c8cc;padding:7px 10px;border-radius:4px;min-height:36px}
    button[aria-pressed=true]{background:#305d57;color:white}label{display:flex;align-items:center;gap:6px}a{color:#225f79}
    #viewport{flex:1;min-height:200px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
    footer{min-height:50px;background:#f6f8f8;border-top:1px solid #becbd0;padding:10px 18px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
    output{font-variant-numeric:tabular-nums}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:700;color:#22383d;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}
    @media(max-width:700px){header{padding:8px;gap:7px}h1{width:100%;font-size:15px}button{font-size:12px;padding:6px 8px}footer{padding:8px;gap:8px;font-size:12px}}
  </style>
</head>
<body>
<header><h1>EXCIT / SPATIAL STUDY 03</h1>
  <nav aria-label="시점"><button data-view="map" aria-pressed="true">전체 평면</button><button data-view="quarry">채석장 평면</button><button data-view="arrival">A 도착</button><button data-view="descent">B 내리막</button><button data-view="entry">C 채석장 입구</button></nav>
  <label><input id="fog" type="checkbox" checked>안개</label><label><input id="backdrop" type="checkbox" checked>바깥 풍경</label>
</header>
<main id="viewport"><div id="labels"></div></main>
<footer><button id="walk">접근로 걷기</button><output id="progress">0.0 / 80.0</output><output id="status">모델 로딩 중</output><a href="/">게임으로</a></footer>
<script type="module" src="./spatial-study-03-live.js"></script>
</body>
</html>
